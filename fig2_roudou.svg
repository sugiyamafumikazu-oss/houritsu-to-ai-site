<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .title { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; fill: #1a202c; }
      .party-name { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 34px; fill: #1a202c; text-anchor: middle; }
      .party-sub { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: 500; font-size: 20px; fill: #4a5568; text-anchor: middle; }
      .label-debt { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 20px; fill: #c53030; }
      .label-claim { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 20px; fill: #1a73e8; }
      .arrow-text { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 21px; fill: #2d3748; }
      .equal-sign { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: 900; font-size: 30px; fill: #718096; text-anchor: middle; }
      .tag-text { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 20px; fill: #1a73e8; text-anchor: middle; }
      .tag-text-highlight { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 20px; fill: #c05621; text-anchor: middle; }
      .bubble-text { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-size: 19px; fill: #2d3748; }
      .goal-text { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, 'Segoe UI', sans-serif; font-weight: bold; font-size: 23px; fill: #1a73e8; text-anchor: end; }
      .box-shadow { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.06)); }
    </style>
    <!-- 矢印マーカー -->
    <marker id="arrow-right-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1a73e8" />
    </marker>
    <marker id="arrow-left-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1a73e8" />
    </marker>
    <marker id="arrow-right-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e53e3e" />
    </marker>
    <marker id="arrow-left-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e53e3e" />
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#718096" />
    </marker>
    <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#4a5568" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" />
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#e2e8f0" stroke-width="2" rx="16" />
  <!-- タイトルバー -->
  <rect x="40" y="35" width="8" height="38" fill="#1a73e8" rx="3" />
  <text x="60" y="64" class="title" font-size="28">【図2】労働契約の構造（労働契約法6条）</text>

  <g transform="translate(220, 340)">
    <rect x="-140" y="-150" width="280" height="300" rx="20" fill="#f7fafc" stroke="#cbd5e0" stroke-width="3" class="box-shadow" />
    <rect x="-140" y="-150" width="280" height="75" rx="20" fill="#ebf8ff" />
    <rect x="-140" y="-95" width="280" height="15" fill="#ebf8ff" />
    <text x="0" y="-102" class="party-name" font-size="28" fill="#1a56db">🏢 事業主（会社）</text>
    <g transform="translate(0, 25)">
  <g transform="scale(1.2)">
    <rect x="-26" y="-36" width="52" height="72" rx="4" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2.5" />
    <!-- 窓 -->
    <line x1="-16" y1="-22" x2="-8" y2="-22" stroke="#2b6cb0" stroke-width="2" />
    <line x1="8" y1="-22" x2="16" y2="-22" stroke="#2b6cb0" stroke-width="2" />
    <line x1="-16" y1="-8" x2="-8" y2="-8" stroke="#2b6cb0" stroke-width="2" />
    <line x1="8" y1="-8" x2="16" y2="-8" stroke="#2b6cb0" stroke-width="2" />
    <line x1="-16" y1="6" x2="-8" y2="6" stroke="#2b6cb0" stroke-width="2" />
    <line x1="8" y1="6" x2="16" y2="6" stroke="#2b6cb0" stroke-width="2" />
    <!-- エントランス -->
    <rect x="-10" y="18" width="20" height="18" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2" />
  </g>
</g>
    <text x="0" y="105" class="party-sub">雇用する側（使用者）</text>
  </g>
  
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="280" height="115" rx="14" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5" class="box-shadow" />
    <text x="20" y="34" class="label-debt" font-size="20">🛡️ 安全配慮義務（労契法5条）</text>
    <text x="20" y="68" font-family="'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="bold" fill="#4a5568">心身の安全に配慮して</text>
    <text x="20" y="94" font-family="'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="bold" fill="#4a5568">働かせる義務</text>
  </g>
  
  <g transform="translate(1380, 390)">
    <rect x="-140" y="-180" width="280" height="370" rx="20" fill="#f7fafc" stroke="#cbd5e0" stroke-width="3" class="box-shadow" />
    <rect x="-140" y="-180" width="280" height="75" rx="20" fill="#ebf8ff" />
    <rect x="-140" y="-120" width="280" height="15" fill="#ebf8ff" />
    <text x="0" y="-130" class="party-name" fill="#1a56db">👩‍💻 労働者</text>
    <g transform="translate(0, 35)">
  <g transform="scale(1.2)">
    <!-- 頭 -->
    <circle cx="0" cy="-18" r="16" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2.5" />
    <!-- 笑顔 -->
    <path d="M -6 -14 Q 0 -8 6 -14" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round" />
    <!-- 体 -->
    <path d="M -28 32 C -28 10, 28 10, 28 32" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2.5" />
    <!-- ノートパソコン -->
    <rect x="-16" y="16" width="32" height="16" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" />
    <line x1="-20" y1="32" x2="20" y2="32" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round" />
  </g>
</g>
    <text x="0" y="130" class="party-sub">働く側（社員・スタッフ）</text>
    <rect x="-100" y="150" width="200" height="28" rx="14" fill="#ffffff" stroke="#cbd5e0" />
    <text x="0" y="169" font-family="'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="bold" fill="#718096" text-anchor="middle">権利で強く守られる立場</text>
  </g>
  
  <g transform="translate(380, 155)">
    <line x1="0" y1="30" x2="840" y2="30" stroke="#718096" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-dashed)" />
    <rect x="180" y="0" width="480" height="52" rx="12" fill="#edf2f7" stroke="#cbd5e0" stroke-width="2" />
    <text x="420" y="33" font-family="'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-weight="bold" font-size="19" fill="#2d3748" text-anchor="middle">👉 指揮命令権（何を・いつ・どのようにやるかを指示できる）</text>
  </g>
  
  <g transform="translate(410, 260)">
    <line x1="10" y1="65" x2="770" y2="65" stroke="#1a73e8" stroke-width="8" marker-end="url(#arrow-right-blue)" />
    
    <!-- 左側：事業主の債務 -->
    <rect x="0" y="-35" width="355" height="82" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="2.5" class="box-shadow" />
    <text x="20" y="-8" class="label-debt">🔴 事業主の債務（会社の義務）</text>
    <text x="20" y="28" class="arrow-text" font-size="22">賃金を支払う義務 💴</text>

    <!-- 中央：イコール -->
    <circle cx="390" cy="5" r="28" fill="#edf2f7" stroke="#cbd5e0" stroke-width="2.5" />
    <text x="390" y="16" class="equal-sign">＝</text>

    <!-- 右側：労働者の債権 -->
    <rect x="425" y="-35" width="355" height="82" rx="12" fill="#ebf8ff" stroke="#bee3f8" stroke-width="2.5" class="box-shadow" />
    <text x="445" y="-8" class="label-claim">🔵 労働者の債権（働く人の権利）</text>
    <text x="445" y="28" class="arrow-text" font-size="22">賃金支払請求権 💼</text>
  </g>
  
  <g transform="translate(410, 455)">
    <line x1="770" y1="75" x2="10" y2="75" stroke="#1a73e8" stroke-width="8" marker-end="url(#arrow-left-blue)" />
    
    <!-- 左側：事業主の債権 -->
    <rect x="0" y="-35" width="355" height="95" rx="12" fill="#ebf8ff" stroke="#bee3f8" stroke-width="2.5" class="box-shadow" />
    <text x="20" y="-8" class="label-claim">🔵 事業主の債権（会社が求める権利）</text>
    <text x="20" y="28" class="arrow-text" font-size="21">労務の提供を求める権利 🤝</text>

    <!-- 中央：イコール -->
    <circle cx="390" cy="11" r="28" fill="#edf2f7" stroke="#cbd5e0" stroke-width="2.5" />
    <text x="390" y="22" class="equal-sign">＝</text>

    <!-- 右側：労働者の債務 -->
    <rect x="425" y="-35" width="355" height="95" rx="12" fill="#fff5f5" stroke="#feb2b2" stroke-width="2.5" class="box-shadow" />
    <text x="445" y="-8" class="label-debt">🔴 労働者の債務（働く人の義務）</text>
    <text x="445" y="24" class="arrow-text" font-size="20">労務を提供する義務</text>
    <text x="445" y="48" font-family="'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="15" font-weight="bold" fill="#c53030">（職務専念義務・職場秩序遵守義務）</text>
  </g>
  
  <g transform="translate(390, 625)">
    <rect x="0" y="0" width="820" height="64" rx="32" fill="#f7fafc" stroke="#4a5568" stroke-width="2" stroke-dasharray="6,4" />
    <path d="M 410 -14 L 420 0 L 400 0 Z" fill="#4a5568" />
    <text x="410" y="39" class="bubble-text" font-weight="bold" text-anchor="middle">💡 AIツールの利用指示も指揮命令権の行使。会社情報をAIに入力しないことは職場秩序遵守義務の一部</text>
  </g>
  
  <g transform="translate(80, 775)">
    <text x="0" y="32" font-family="'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-weight="bold" font-size="22" fill="#4a5568">契約の性質：</text>
    <rect x="130" y="0" width="130" height="48" rx="24" fill="#ebf8ff" stroke="#1a73e8" stroke-width="2.5" />
    <text x="195" y="31" class="tag-text">双務</text>
    <rect x="280" y="0" width="130" height="48" rx="24" fill="#ebf8ff" stroke="#1a73e8" stroke-width="2.5" />
    <text x="345" y="31" class="tag-text">有償</text>
    <rect x="430" y="0" width="130" height="48" rx="24" fill="#ebf8ff" stroke="#1a73e8" stroke-width="2.5" />
    <text x="495" y="31" class="tag-text">諾成</text>
  </g>
  
  <g transform="translate(1520, 805)">
    <text x="0" y="0" class="goal-text">🎯 契約のゴール：お互いが債務を履行し終えること（完遂）</text>
  </g>
  </svg>
  